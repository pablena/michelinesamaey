  - name: Setup Node (optional)
    uses: actions/setup-node@v4
    with:
      node-version: '18'

  # If your site needs a build step (npm, bundler, static generator),
  # uncomment and adapt the following steps:
  # - name: Install dependencies
  #   run: npm ci
  # - name: Build
  #   run: npm run build
  # - name: Use build output
  #   run: ls -la ./dist

  - name: Deploy to gh-pages
    uses: peaceiris/actions-gh-pages@v3
    with:
      github_token: ${{ secrets.GITHUB_TOKEN }}
      publish_branch: gh-pages
      publish_dir: ./
      force_orphan: true
